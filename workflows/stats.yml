name: Estatísticas PNG do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * *'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar biblioteca de imagem
        run: python -m pip install Pillow

      - name: Atualizar estatísticas públicas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py

      - name: Salvar PNG no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar estatísticas do perfil"
            git push
          fi
